spring:
  application:
    name: chess-api

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    chess.api: DEBUG
    org.springframework.data.redis: INFO
    org.springframework.web: INFO

chess:
  game:
    abandoned-timeout-minutes: 60
    completed-ttl-hours: 24
