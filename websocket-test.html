<!DOCTYPE html>
<html>
<head>
    <title>Chess WebSocket Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .section {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 5px;
        }
        h2 {
            margin-top: 0;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            margin: 5px;
            border-radius: 4px;
        }
        button:hover {
            background: #45a049;
        }
        button.danger {
            background: #f44336;
        }
        input, select {
            padding: 8px;
            margin: 5px 0;
            width: 200px;
        }
        #messages {
            border: 1px solid #ddd;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
            background: #f9f9f9;
            font-family: monospace;
            font-size: 12px;
        }
        .message {
            margin: 5px 0;
            padding: 5px;
            background: white;
            border-left: 3px solid #4CAF50;
        }
        .error {
            border-left-color: #f44336;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .connected {
            background: #d4edda;
            color: #155724;
        }
        .disconnected {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Chess WebSocket Test Client</h1>

    <div class="status" id="status">Disconnected</div>

    <div class="container">
        <!-- Left Panel: REST API Actions -->
        <div class="section">
            <h2>REST API Actions</h2>

            <h3>1. Create Game</h3>
            <input type="text" id="playerName" placeholder="Player Name" value="TestPlayer">
            <select id="gameMode">
                <option value="SINGLE_PLAYER">Single Player</option>
                <option value="MULTIPLAYER">Multiplayer</option>
            </select>
            <button onclick="createGame()">Create Game</button>

            <h3>2. Make Move (REST)</h3>
            <input type="text" id="gameId" placeholder="Game ID">
            <input type="text" id="moveFrom" placeholder="From (e.g., e2)" value="e2">
            <input type="text" id="moveTo" placeholder="To (e.g., e4)" value="e4">
            <button onclick="makeRestMove()">Make Move via REST</button>

            <h3>3. Get Game State</h3>
            <button onclick="getGameState()">Get Current State</button>
        </div>

        <!-- Right Panel: WebSocket Actions -->
        <div class="section">
            <h2>WebSocket Actions</h2>

            <h3>1. Connect to WebSocket</h3>
            <input type="text" id="wsGameId" placeholder="Game ID to subscribe">
            <button onclick="connectWebSocket()">Connect WebSocket</button>
            <button class="danger" onclick="disconnectWebSocket()">Disconnect</button>

            <h3>2. Make Move (WebSocket)</h3>
            <input type="text" id="wsMoveFrom" placeholder="From (e.g., e7)" value="e7">
            <input type="text" id="wsMoveTo" placeholder="To (e.g., e5)" value="e5">
            <button onclick="makeWsMove()">Make Move via WS</button>

            <h3>3. Join Game</h3>
            <input type="text" id="wsPlayerName" placeholder="Player Name" value="Player2">
            <select id="wsColorChoice">
                <option value="WHITE">White</option>
                <option value="BLACK">Black</option>
            </select>
            <button onclick="joinGame()">Join via WS</button>
        </div>
    </div>

    <!-- Messages Panel -->
    <div class="section" style="margin-top: 20px;">
        <h2>Messages</h2>
        <div id="messages"></div>
        <button onclick="clearMessages()">Clear Messages</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script>
        const API_URL = 'http://localhost:8080/api/v1/games';
        const WS_URL = 'http://localhost:8080/ws/chess';
        let stompClient = null;
        let currentGameId = null;

        function log(message, isError = false) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message' + (isError ? ' error' : '');
            messageDiv.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateStatus(connected) {
            const statusDiv = document.getElementById('status');
            if (connected) {
                statusDiv.textContent = 'Connected to WebSocket';
                statusDiv.className = 'status connected';
            } else {
                statusDiv.textContent = 'Disconnected';
                statusDiv.className = 'status disconnected';
            }
        }

        // REST API Functions
        async function createGame() {
            const playerName = document.getElementById('playerName').value;
            const gameMode = document.getElementById('gameMode').value;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ playerName, gameMode })
                });
                const data = await response.json();
                currentGameId = data.gameId;
                document.getElementById('gameId').value = currentGameId;
                document.getElementById('wsGameId').value = currentGameId;
                log('Game created: ' + currentGameId);
                log('Game state: ' + JSON.stringify(data, null, 2));
            } catch (error) {
                log('Error creating game: ' + error.message, true);
            }
        }

        async function makeRestMove() {
            const gameId = document.getElementById('gameId').value;
            const from = document.getElementById('moveFrom').value;
            const to = document.getElementById('moveTo').value;

            try {
                const response = await fetch(`${API_URL}/${gameId}/moves`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ from, to })
                });
                const data = await response.json();
                log('Move made via REST: ' + from + ' → ' + to);
                log('Response: ' + JSON.stringify(data, null, 2));
            } catch (error) {
                log('Error making move: ' + error.message, true);
            }
        }

        async function getGameState() {
            const gameId = document.getElementById('gameId').value;

            try {
                const response = await fetch(`${API_URL}/${gameId}`);
                const data = await response.json();
                log('Game state retrieved:');
                log(JSON.stringify(data, null, 2));
            } catch (error) {
                log('Error getting game state: ' + error.message, true);
            }
        }

        // WebSocket Functions
        function connectWebSocket() {
            const gameId = document.getElementById('wsGameId').value;
            if (!gameId) {
                log('Please enter a Game ID to subscribe', true);
                return;
            }

            const socket = new SockJS(WS_URL);
            stompClient = Stomp.over(socket);

            stompClient.connect({}, function(frame) {
                log('WebSocket connected!');
                updateStatus(true);

                // Subscribe to game updates
                stompClient.subscribe('/topic/game/' + gameId, function(message) {
                    const update = JSON.parse(message.body);
                    log('WebSocket update received:');
                    log('Type: ' + update.type);
                    log('Message: ' + (update.message || 'Game state updated'));
                    if (update.gameState) {
                        log('Current turn: ' + update.gameState.currentTurn);
                        log('Full update: ' + JSON.stringify(update, null, 2));
                    }
                });

                log('Subscribed to /topic/game/' + gameId);
            }, function(error) {
                log('WebSocket error: ' + error, true);
                updateStatus(false);
            });
        }

        function disconnectWebSocket() {
            if (stompClient !== null) {
                stompClient.disconnect();
                log('WebSocket disconnected');
                updateStatus(false);
            }
        }

        function makeWsMove() {
            if (!stompClient || !stompClient.connected) {
                log('Please connect WebSocket first', true);
                return;
            }

            const gameId = document.getElementById('wsGameId').value;
            const from = document.getElementById('wsMoveFrom').value;
            const to = document.getElementById('wsMoveTo').value;
            const playerName = document.getElementById('wsPlayerName').value;

            stompClient.send('/app/game/' + gameId + '/move', {}, JSON.stringify({
                from,
                to,
                playerName
            }));
            log('Move sent via WebSocket: ' + from + ' → ' + to + ' by ' + playerName);
        }

        function joinGame() {
            if (!stompClient || !stompClient.connected) {
                log('Please connect WebSocket first', true);
                return;
            }

            const gameId = document.getElementById('wsGameId').value;
            const playerName = document.getElementById('wsPlayerName').value;
            const color = document.getElementById('wsColorChoice').value;

            stompClient.send('/app/game/' + gameId + '/join', {}, JSON.stringify({
                playerName: playerName,
                color: color
            }));
            log('Join request sent: ' + playerName + ' as ' + color);
        }

        function clearMessages() {
            document.getElementById('messages').innerHTML = '';
        }

        // Initialize
        log('Chess WebSocket Test Client Ready');
        log('Instructions:');
        log('1. Create a game using REST API');
        log('2. Connect WebSocket with the game ID');
        log('3. Make moves via REST or WebSocket');
        log('4. Watch for real-time updates!');
    </script>
</body>
</html>
